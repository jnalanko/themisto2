[package]
name = "themisto2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "extract_from_three_files"
path = "src/extract_from_three_files.rs"

[[bin]]
name = "themisto2"
path = "src/main.rs"

[dependencies]

statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"
sbwt = {path = "./sbwt-rs-cli/api"}
bitvec = {version = "1.0", features = ["serde"]}
bincode = "1.3"
clap = "4.5" 
byteorder = "1.5"
indicatif = "0.17"
jseqio = "0.1.6"
env_logger = "0.10"
log = "0.4"
simple-sds-sbwt = "0.3.1"
serde = {version = "1.0.210", features = ["derive"]}
serde_json = "1.0.128"
crossbeam = "0.8.4"
rustc-hash = "2.1.1"
rand_chacha = "0.9.0"
rayon = "1.11.0"
bytemuck = {version = "1.24.0", features = ["extern_crate_alloc"]}
sha1 = "0.10.6"
human_bytes = "0.4.3"

# Optional: tighter integration with ggcat. Gated behind the `ggcat` feature
# gate to avoid having a mandatory dependency to ggcat, which is a large
# complicated codebase and takes a long time to build. Using the ggcat
# feature bloats the size of the final executable from 90 MiB to 850 MiB!
ggcat_api = { path = "./ggcat/crates/api", package = "ggcat-api", optional = true }
parking_lot = { version = "0.12", optional = true }
# Pin transitive deps so the `ggcat` feature picks up the same versions ggcat
# was built against. Without these, the cargo resolver climbs to newer minor
# releases that have breaking trait changes ggcat's own lockfile shielded it
# from.
parallel-processor = { version = "=0.2.3", optional = true }

[features]
default = []
ggcat = ["dep:ggcat_api", "dep:parking_lot", "dep:parallel-processor"]

[profile.release]
debug = true      # keep symbols so profilers can show Rust function names
