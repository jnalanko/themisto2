[package]
name = "themisto2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "themisto2"
path = "src/main.rs"

[[bin]]
name = "verify_gfa_links"
path = "src/bin/verify_gfa_links.rs"
required-features = ["extra-tools"]

[[bin]]
name = "compare_color_dumps"
path = "src/bin/compare_color_dumps.rs"
required-features = ["extra-tools"]

[[bin]]
name = "bench_producer_consumer_io"
path = "src/bench_producer_consumer_io.rs"
required-features = ["extra-tools"]

[[bin]]
name = "extract_from_three_files"
path = "src/extract_from_three_files.rs"
required-features = ["extra-tools"]

[features]
extra-tools = []

[dependencies]

statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"
sbwt = {path = "./sbwt-rs-cli/api"}
bitvec = {version = "1.0", features = ["serde"]}
bincode = "1.3"
clap = "4.5" 
byteorder = "1.5"
indicatif = "0.17"
jseqio = "0.1.6"
needletail = "=0.7.3"
env_logger = "0.10"
log = "0.4"
simple-sds-sbwt = "0.3.1"
serde = {version = "1.0.210", features = ["derive"]}
serde_json = "1.0.128"
crossbeam = "0.8.4"
rustc-hash = "2.1.1"
rand_chacha = "0.9.0"
rayon = "1.11.0"
bytemuck = {version = "1.24.0", features = ["extern_crate_alloc"]}
sha1 = "0.10.6"
human_bytes = "0.4.3"
memory-stats = "1.2.0"

[profile.release]
debug = true      # keep symbols so profilers can show Rust function names
